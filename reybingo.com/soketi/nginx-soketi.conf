# ─────────────────────────────────────────────────────────────────────────────
# nginx-soketi.conf - Configuracion de Nginx para WebSocket con Soketi
#
# Este bloque va DENTRO de tu server block HTTPS existente de bingo.reybingo.com
# Agrega este location antes del location PHP.
# ─────────────────────────────────────────────────────────────────────────────
#
# Estructura del archivo Nginx de tu sitio (referencia):
#
# server {
#     listen 443 ssl;
#     server_name bingo.reybingo.com;
#     # ... configuracion SSL ...
#
#     # ==== AGREGAR ESTO PARA SOKETI WebSocket ====
#     location /app/ {
#         proxy_pass http://127.0.0.1:6001;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "Upgrade";
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_read_timeout 3600s;
#         proxy_send_timeout 3600s;
#         proxy_connect_timeout 10s;
#     }
#
#     # Endpoint de auth de canales privados
#     # (ya lo maneja PHP/CodeIgniter via /pusher/auth, sin cambios)
#
#     # ==== FIN DEL BLOQUE SOKETI ====
#
#     # ... tu configuracion PHP/CI4 existente ...
# }
#
# ─────────────────────────────────────────────────────────────────────────────
# NOTAS IMPORTANTES:
#
# 1. /app/ es la ruta que usa pusher-js para conectarse a Soketi.
#    El protocolo de Pusher usa:  wss://tu-dominio.com/app/SOKETI_KEY?...
#    Soketi escucha en 127.0.0.1:6001 y Nginx hace el proxy con upgrade WS.
#
# 2. proxy_read_timeout 3600s: OBLIGATORIO para WebSockets de larga duración.
#    Sin esto Nginx cierra la conexión WebSocket cada 60s por defecto.
#
# 3. No es necesario abrir el puerto 6001 en el firewall (UFW/iptables).
#    Soketi solo escucha en 127.0.0.1 y Nginx actua como unico punto de entrada.
# ─────────────────────────────────────────────────────────────────────────────
#
# Comandos de referencia para instalar en VPS (Ubuntu 22.04):
#
# # 1) Instalar Node.js 20 LTS
# curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
# sudo apt-get install -y nodejs
#
# # 2) Instalar Soketi globalmente
# sudo npm install -g @soketi/soketi
#
# # 3) Instalar PM2 globalmente
# sudo npm install -g pm2
#
# # 4) Crear directorio de config y copiar soketi.json
# sudo mkdir -p /etc/soketi
# sudo cp soketi/soketi.json /etc/soketi/soketi.json
# # EDITAR /etc/soketi/soketi.json con tus valores reales de key/secret/id
#
# # 5) Arrancar Soketi con PM2
# pm2 start "soketi start --config=/etc/soketi/soketi.json" --name soketi
# pm2 save
# pm2 startup
#
# # 6) Copiar bingo-runner al VPS y arrancarlo
# cd /var/www/reybingo.com/public_html/bingo-runner
# cp .env.example .env
# # Editar .env con los valores correctos
# pm2 start ecosystem.config.json
# pm2 save
#
# # 7) Agregar el bloque location /app/ en la config de Nginx (arriba)
# sudo nginx -t && sudo systemctl reload nginx
#
# # 8) Agregar las variables de Soketi en .env de CodeIgniter:
# SOKETI_KEY     = reybingo-key          (igual que en soketi.json)
# SOKETI_SECRET  = reybingo-secret...    (igual que en soketi.json)
# SOKETI_APP_ID  = reybingo-app-id       (igual que en soketi.json)
# SOKETI_HOST    = bingo.reybingo.com    (dominio publico, para que el frontend conecte)
# SOKETI_PORT    = 443                   (Nginx expone el WS en 443 con SSL)
# SOKETI_USETLS  = false                 (Soketi habla HTTP interno, Nginx hace TLS)
# ─────────────────────────────────────────────────────────────────────────────
