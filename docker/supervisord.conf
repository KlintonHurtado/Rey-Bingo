[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stderr_logfile=/var/log/apache2_err.log
stdout_logfile=/var/log/apache2_out.log

[program:soketi]
command=soketi start --config=/var/www/html/reybingo.com/soketi/soketi.json
autostart=true
autorestart=true
stderr_logfile=/var/log/soketi_err.log
stdout_logfile=/var/log/soketi_out.log

[program:bingo-runner]
directory=/var/www/html/reybingo.com/public_html/bingo-runner
command=node index.js
autostart=true
autorestart=true
stderr_logfile=/var/log/runner_err.log
stdout_logfile=/var/log/runner_out.log
