# Configuracion global de workers MPM Prefork (server config context)
<IfModule mpm_prefork_module>
    StartServers              5
    MinSpareServers           5
    MaxSpareServers          20
    ServerLimit             150
    MaxRequestWorkers       150
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/reybingo.com/public_html/public

    # Prevencion de bloqueo de workers y timeouts 502/504
    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 2

    <Directory /var/www/html/reybingo.com/public_html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Soketi WebSockets reverse proxy
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/app/(.*) ws://127.0.0.1:6001/app/$1 [P,L]

    ProxyPass /app/ ws://127.0.0.1:6001/app/
    ProxyPassReverse /app/ ws://127.0.0.1:6001/app/

    ProxyPass /apps/ http://127.0.0.1:6001/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:6001/apps/

    ErrorLog ${APACHE_LOG_DIR}/reybingo_error.log
    CustomLog ${APACHE_LOG_DIR}/reybingo_access.log combined
</VirtualHost>
